[project]
name = "intellidoc"
version = "0.1.0"
description = "Document ingestion, retrieval and evaluation service for IntelliDoc"
authors = [
    { name = "yashala", email = "37179971+yashala@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "fastembed>=0.9.0",
    "langchain-core>=1.6.8",
    "langchain-google-genai>=4.4.0",
    "langgraph>=1.2.14",
    "langsmith>=0.14.4",
    "numpy>=2.5.3",
    "pdfplumber>=0.11.10",
    "pgvector>=0.5.0",
    "pillow>=12.3.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pypdfium2>=5.14.0",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "reportlab>=5.0.1",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a running Postgres (DATABASE_URL)"]
