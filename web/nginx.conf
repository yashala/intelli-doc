server {
    listen 8080;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8000/;
        # Scanned PDFs are OCR'd during the upload request (~3 s per page).
        client_max_body_size 25m;
        proxy_read_timeout 600s;
    }

    location / {
        try_files $uri /index.html;
    }
}
